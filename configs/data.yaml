# Data configuration for RobustDeep

paths:
  raw_root: data/raw
  faces_root: data/faces
  processed_root: data/processed
  artifacts_root: artifacts

datasets:
  faceforensics:
    name: FaceForensics++
    raw_subdir: faceforensics
    faces_subdir: faceforensics
    methods: [original, deepfakes, face2face, faceswap, neuraltextures]
    real_label: 0
    fake_label: 1
  celebdf:
    name: Celeb-DF
    raw_subdir: celebdf
    faces_subdir: celebdf
    methods: [real, fake]
    real_label: 0
    fake_label: 1
  dfdc:
    name: DFDC
    raw_subdir: dfdc
    faces_subdir: dfdc
    methods: [real, fake]
    real_label: 0
    fake_label: 1
sampling:
  frames_per_video: 16
  face_size: 224
  min_face_size: 64
  detection_confidence: 0.7

normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  identity_disjoint: true

augmentation:
  train:
    horizontal_flip: 0.5
    color_jitter: 0.3
    jpeg_quality: [40, 100]
    gaussian_blur: [0, 1.5]
    resize_reencode: true
  val_test:
    none: true
