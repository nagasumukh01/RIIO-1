# Render Blueprint — deploys both services from this repo
# Docs: https://render.com/docs/blueprint-spec
#
# To deploy:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance"
#   4. Connect your GitHub repo (nagasumukh01/RIIO-1)
#   5. Render auto-detects this file and deploys both services

services:
  # ─── FastAPI Backend ──────────────────────────────────────────
  - type: web
    name: robustdeep-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health
    autoDeploy: true

  # ─── Streamlit Frontend ───────────────────────────────────────
  - type: web
    name: robustdeep-dashboard
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      # The Streamlit app can call the API backend if needed
      - key: API_BASE_URL
        fromService:
          name: robustdeep-api
          type: web
          property: host
    autoDeploy: true
